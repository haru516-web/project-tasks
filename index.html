<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロジェクト別タスク管理</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タスク管理">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131517">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf7; --surface: #ffffff; --text: #1a1d21; --dim: #62666d;
    --border: #e3e1da; --accent: #0f766e; --accent-text: #ffffff;
    --amber-bg: #fef3c7; --amber-text: #92400e; --amber-strong: #b45309;
    --danger: #dc2626;
    --prio-red-bg: #fee2e2; --prio-yellow-bg: #fef9c3; --prio-green-bg: #dcfce7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131517; --surface: #1d2023; --text: #e8eaed; --dim: #9aa0a6;
      --border: #33373c; --accent: #2dd4bf; --accent-text: #0b1210;
      --amber-bg: #3a2c07; --amber-text: #fcd34d; --amber-strong: #f59e0b;
      --danger: #f87171;
      --prio-red-bg: #3d1e22; --prio-yellow-bg: #38300b; --prio-green-bg: #0d2b1a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
  main { padding:20px 16px 48px; max-width:760px; margin:0 auto; }
  .summary { margin-bottom:16px; line-height:1.5; }
  .summary .big { font-size:24px; font-weight:700; }
  .summary .sub { color:var(--dim); font-size:14px; }
  .tabs { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px; margin-bottom:20px; }
  .tab { flex:1; padding:8px; border:none; border-radius:9px; background:transparent; color:var(--dim); font-size:14px; transition: background-color .15s, color .15s; cursor:pointer; }
  .tab.active { background:var(--accent); color:var(--accent-text); font-weight:600; }
  .project { margin-bottom:22px; }
  .p-head { display:flex; align-items:center; gap:10px; padding:2px 0 8px; }
  .chev { width:32px; height:32px; flex:none; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--dim); font-size:12px; cursor:pointer; }
  .p-name { font-size:18px; font-weight:700; flex:1; word-break:break-word; }
  .p-count { color:var(--dim); font-size:13px; white-space:nowrap; }
  .nbadge { flex:none; min-width:23px; height:23px; border-radius:999px; background:#dc2626; color:#fff; font-size:13px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 7px; }
  .del-link { background:none; border:none; color:var(--dim); font-size:13px; cursor:pointer; padding:4px; }
  .del-confirm { display:flex; gap:6px; align-items:center; }
  .del-yes { background:var(--danger); color:#fff; border:none; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .del-no { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .task { display:flex; align-items:flex-start; gap:10px; padding:12px 16px; }
  .task + .task { border-top:1px solid var(--border); }
  .task.held { background:var(--amber-bg); }
  .task.prio-red { background:var(--prio-red-bg); }
  .task.prio-yellow { background:var(--prio-yellow-bg); }
  .task.prio-green { background:var(--prio-green-bg); }
  .pbadge { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:1px 7px; margin-left:8px; vertical-align:2px; }
  .pbadge.red { background:#dc2626; color:#fff; }
  .pbadge.yellow { background:#facc15; color:#713f12; }
  .pbadge.green { background:#86efac; color:#14532d; }
  .pdots { display:inline-flex; gap:6px; align-items:center; }
  .pdot { width:20px; height:20px; border-radius:999px; border:2px solid var(--border); cursor:pointer; padding:0; }
  .pdot.on { border-color:var(--text); }
  .mv { background:none; border:1px solid var(--border); color:var(--dim); border-radius:7px; font-size:11px; padding:3px 8px; cursor:pointer; }
  .task input[type=checkbox] { width:24px; height:24px; flex:none; margin:0; accent-color:var(--accent); cursor:pointer; }
  .t-main { flex:1; min-width:0; }
  .t-title { font-size:16px; word-break:break-word; }
  .task.held .t-title { color:var(--dim); }
  .task.completing .t-title { text-decoration: line-through; color:var(--dim); }
  .badge-hold { display:inline-block; background:var(--amber-strong); color:#fff; font-size:11px; font-weight:600; border-radius:6px; padding:1px 7px; margin-left:8px; vertical-align:2px; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; border-radius:999px; padding:3px 10px; }
  .pill .dot { width:8px; height:8px; border-radius:999px; flex:none; }
  .proj-pill { border:1px solid var(--border); color:var(--dim); font-size:12px; border-radius:999px; padding:3px 10px; }
  .hold-btn { flex:none; background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:999px; font-size:12px; padding:6px 12px; cursor:pointer; }
  .hold-btn.on { border-color:var(--amber-strong); color:var(--amber-text); background:var(--amber-bg); }
  .add-row { width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--border); color:var(--accent); font-size:14px; padding:12px 16px; cursor:pointer; }
  .add-form { border-top:1px solid var(--border); padding:14px 16px; }
  .add-form input[type=text] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:10px; font-size:16px; margin-bottom:12px; }
  .f-label { font-size:12px; color:var(--dim); margin:10px 0 6px; }
  .toggle { display:flex; gap:8px; }
  .toggle button { flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--dim); font-size:14px; cursor:pointer; }
  .toggle button.sel-normal { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  .toggle button.sel-hold { background:var(--amber-strong); color:#fff; border-color:var(--amber-strong); font-weight:600; }
  .f-desc { font-size:12px; color:var(--dim); margin-top:6px; }
  .pills { display:flex; flex-wrap:wrap; gap:7px; }
  .pills .pill { border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font-size:12.5px; padding:6px 11px; }
  .submit { width:100%; margin-top:14px; background:var(--accent); color:var(--accent-text); border:none; border-radius:10px; padding:11px; font-size:15px; font-weight:600; cursor:pointer; }
  .submit.hold { background:var(--amber-strong); color:#fff; }
  .error { color:var(--danger); font-size:13px; margin-top:8px; }
  .cancel-btn { width:100%; margin-top:8px; background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:10px; padding:10px; font-size:14px; cursor:pointer; }
  .empty { color:var(--dim); font-size:14px; padding:14px 16px; }
  .g-head { display:flex; align-items:center; gap:8px; margin:18px 0 8px; }
  .g-head .dot { width:10px; height:10px; border-radius:999px; }
  .g-head .g-name { font-size:18px; font-weight:700; }
  .g-count { border:1px solid var(--border); background:var(--surface); color:var(--dim); border-radius:999px; font-size:12px; padding:2px 10px; }
  .new-proj { display:flex; gap:8px; margin-top:6px; }
  .new-proj input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:11px; font-size:15px; }
  .new-proj button { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 14px; font-size:14px; cursor:pointer; }
  .dragging { position:relative; z-index:30; box-shadow:0 10px 28px rgba(0,0,0,.28); }
  body.proj-drag .project .card { display:none; }
  body.proj-drag .new-proj { display:none; }
  .project.dragging .p-head { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px 10px; box-shadow:0 10px 28px rgba(0,0,0,.25); }
</style>
</head>
<body>
<main id="main"></main>

<script>
var GROUPS = [
  { name: "PC1", color: "#3b6ea5", items: [["pc1-codex","PC1（自宅）・Codex"],["pc1-claude","PC1（自宅）・Claude"],["pc1-muse","PC1（自宅）・Muse（今後）"]] },
  { name: "PC2", color: "#0f766e", items: [["pc2-codex","PC2（持ち運び）・Codex"],["pc2-claude","PC2（持ち運び）・Claude"],["pc2-muse","PC2（持ち運び）・Muse"]] },
  { name: "モバイル", color: "#b45309", items: [["mobile-kodama","モバイル・Muse こだま"],["mobile-sensei","モバイル・Muse 先生"]] },
  { name: "その他", color: "#6b7280", items: [["muse-hub","Muse（ハブ）"],["self","あなた（ユーザー本人）"]] },
  { name: "未定", color: "#9ca3af", items: [["unassigned","未定"]] }
];
var LABEL = {}, COLOR = {};
GROUPS.forEach(function(g){ g.items.forEach(function(it){ LABEL[it[0]] = it[1]; COLOR[it[0]] = g.color; }); });
var ORDER = Object.keys(LABEL);
var PRIO = { red: {label:"最重要", color:"#dc2626"}, yellow: {label:"優先", color:"#eab308"}, green: {label:"低優先", color:"#4ade80"} };

var SEED = {
  projects: [
    {id:1, name:"もび道", open:true},
    {id:2, name:"週1 新規制作", open:true},
    {id:3, name:"発想メモワールド", open:true},
    {id:4, name:"潮環占い", open:true},
    {id:5, name:"推しタウン", open:true},
    {id:6, name:"モビー公式サイト", open:true},
    {id:7, name:"にゃっコレ", open:true},
    {id:8, name:"基盤・PC接続", open:true}
  ],
  tasks: [
    {projectId:1, title:"サーバー（Cloudflare Workers＋D1）をデプロイして接続する", assignee:"pc2-claude", hold:false},
    {projectId:1, title:"アプリ内課金を接続する", assignee:"pc2-codex", hold:false},
    {projectId:1, title:"イベント巡礼を実装する", assignee:"pc2-claude", hold:false},
    {projectId:1, title:"41秒PR動画の「全42種」表記を87種に直す（または外す）", assignee:"muse-hub", hold:false},
    {projectId:7, title:"App Store分析（毎日）＋施策分析", assignee:"pc1-codex", hold:false},
    {projectId:4, title:"App Store分析（毎日）＋施策分析", assignee:"pc1-codex", hold:false},
    {projectId:4, title:"note hub-1原稿の確認（相性16タイプ／40タイプ表記）", assignee:"self", hold:false},
    {projectId:4, title:"結果文・性格文を決める", assignee:"self", hold:false},
    {projectId:4, title:"潮祖3Dの頭サイズを決める（現行／10%拡大）", assignee:"self", hold:false},
    {projectId:4, title:"プレミアム本番化（Stripe本番価格＋サイト組み込み）", assignee:"muse-hub", hold:false},
    {projectId:6, title:"にゃこモビー診断を公開する", assignee:"pc2-claude", hold:false},
    {projectId:6, title:"診断のメアド登録の集約先を確認する", assignee:"muse-hub", hold:false},
    {projectId:6, title:"サイトの更新方法を確認する", assignee:"muse-hub", hold:false},
    {projectId:8, title:"PC1にMuseを入れる", assignee:"self", hold:false},
    {projectId:8, title:"PC1のReason serve障害（EUNKNOWN, uv_spawn）を直す", assignee:"self", hold:false},
    {projectId:8, title:"PC1/PC2との接続を安定化する", assignee:"muse-hub", hold:false},
    {projectId:8, title:"アプリ用画像アセット生成（依頼ベース）", assignee:"pc1-codex", hold:false},
    {projectId:8, title:"App Store Connect APIキーをPC1に置く", assignee:"self", hold:false},
    {projectId:8, title:"PCのChromeでTikTokにログインしておく", assignee:"self", hold:false},
    {projectId:2, title:"今週の新規×1（アプリ／事業／サイト）を決めて作る", assignee:"self", hold:false},
    {projectId:3, title:"ピンチ／タップ接続／マージを実機でテストする", assignee:"self", hold:false},
    {projectId:3, title:"クラウド同期の方針を決める", assignee:"self", hold:true},
    {projectId:5, title:"Gate 1の判断", assignee:"self", hold:false},
    {projectId:5, title:"改訂briefから提案スライドを作る", assignee:"muse-hub", hold:false}
  ]
};

var KEY = "projectTasksV1";
var state;
try { state = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) { state = null; }
if (!state || !state.projects) {
  state = JSON.parse(JSON.stringify(SEED));
  state.tasks.forEach(function(t, i){ t.id = 1000 + i; });
  save();
}
var UIKEY = "projectTasksUiV1";
var savedUi = {};
try { savedUi = JSON.parse(localStorage.getItem(UIKEY) || "{}"); } catch(e) { savedUi = {}; }
var closedA = savedUi.closedA || {};
function saveUi(){ try { localStorage.setItem(UIKEY, JSON.stringify({ closedA: closedA })); } catch(e){} }
var ui = { view: "project", formFor: null, formTitle: "", formStatus: "normal", formAssignee: "unassigned", formPriority: "none", formError: "", delConfirm: null, completing: {} };

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function projTasks(pid){ return state.tasks.filter(function(t){ return t.projectId === pid; }); }
function projName(pid){ for (var i=0;i<state.projects.length;i++) if (state.projects[i].id===pid) return state.projects[i].name; return ""; }
function holdCount(ts){ return ts.filter(function(t){ return t.hold; }).length; }

function taskRow(t, showProj) {
  var c = COLOR[t.assignee] || "#9ca3af";
  var cls = "task" + (t.hold ? " held" : "") + (ui.completing[t.id] ? " completing" : "") + ((t.priority && PRIO[t.priority] && !t.hold) ? " prio-" + t.priority : "");
  return '<div class="' + cls + '">'
    + '<input type="checkbox" data-act="done" data-id="' + t.id + '"' + (ui.completing[t.id] ? " checked" : "") + '>'
    + '<div class="t-main"><span class="t-title">' + esc(t.title) + '</span>'
    + ((t.priority && PRIO[t.priority]) ? '<span class="pbadge ' + t.priority + '">' + PRIO[t.priority].label + '</span>' : '')
    + (t.hold ? '<span class="badge-hold">保留</span>' : '')
    + '<div class="meta"><span class="pill" style="background:color-mix(in srgb, ' + c + ' 13%, transparent); color:' + c + '"><span class="dot" style="background:' + c + '"></span>' + esc(LABEL[t.assignee] || t.assignee) + '</span>'
    + (showProj ? '<span class="proj-pill">' + esc(projName(t.projectId)) + '</span>' : '')
    + '<span class="pdots">' + ["red","yellow","green"].map(function(pc){ return '<button class="pdot' + (t.priority===pc ? ' on' : '') + '" data-act="prio" data-id="' + t.id + '" data-v="' + pc + '" style="background:' + PRIO[pc].color + '" title="優先度: ' + PRIO[pc].label + '"></button>'; }).join("") + '</span>'
    + (showProj ? '' : '<span><button class="mv" data-act="up" data-id="' + t.id + '">↑</button> <button class="mv" data-act="down" data-id="' + t.id + '">↓</button></span>')
    + '</div></div>'
    + '<button class="hold-btn' + (t.hold ? ' on' : '') + '" data-act="hold" data-id="' + t.id + '">' + (t.hold ? '保留を解除' : '保留にする') + '</button>'
    + '</div>';
}

function addForm(p) {
  var isHold = ui.formStatus === "hold";
  var h = '<div class="add-form">'
    + '<input type="text" id="formTitle" placeholder="タスク名" value="' + esc(ui.formTitle) + '">'
    + '<div class="f-label">状態</div><div class="toggle">'
    + '<button data-act="status" data-v="normal" class="' + (!isHold ? 'sel-normal' : '') + '">通常</button>'
    + '<button data-act="status" data-v="hold" class="' + (isHold ? 'sel-hold' : '') + '">保留</button></div>'
    + '<div class="f-desc">' + (isHold ? '保留として追加します。後から「保留を解除」で通常に戻せます。' : '通常のタスクとして追加します。') + '</div>';
  h += '<div class="f-label">優先度</div><div class="pills">';
  [["none","なし","#9ca3af"],["red","最重要","#dc2626"],["yellow","優先","#eab308"],["green","低優先","#4ade80"]].forEach(function(pr){
    var sel = ui.formPriority === pr[0];
    var style = sel ? ' style="background:' + pr[2] + '; color:' + (pr[0]==="yellow" ? "#713f12" : "#fff") + '; border-color:' + pr[2] + '"' : '';
    h += '<button class="pill" data-act="fprio" data-v="' + pr[0] + '"' + style + '><span class="dot" style="background:' + pr[2] + '"></span>' + pr[1] + '</button>';
  });
  h += '</div>';
  GROUPS.forEach(function(g){
    h += '<div class="f-label">' + esc(g.name) + '</div><div class="pills">';
    g.items.forEach(function(it){
      var sel = ui.formAssignee === it[0];
      var style = sel ? ' style="background:' + g.color + '; color:#fff; border-color:' + g.color + '"' : '';
      h += '<button class="pill" data-act="assignee" data-v="' + it[0] + '"' + style + '>' + esc(it[1]) + '</button>';
    });
    h += '</div>';
  });
  h += '<button class="submit' + (isHold ? ' hold' : '') + '" data-act="submittask" data-id="' + p.id + '">' + (isHold ? '保留として追加' : 'タスクを追加') + '</button>';
  h += '<button class="cancel-btn" data-act="closeform">やめる</button>';
  if (ui.formError) h += '<div class="error">' + esc(ui.formError) + '</div>';
  h += '</div>';
  return h;
}

function sortByPrio(ts) {
  var rank = { red: 0, yellow: 1, green: 2 };
  return ts.slice().sort(function(a, b){ return (rank[a.priority] !== undefined ? rank[a.priority] : 3) - (rank[b.priority] !== undefined ? rank[b.priority] : 3); });
}
function moveTask(id, dir) {
  var t = null;
  state.tasks.forEach(function(x){ if (x.id === id) t = x; });
  if (!t) return;
  var idxs = [];
  state.tasks.forEach(function(x, i){ if (x.projectId === t.projectId) idxs.push(i); });
  var pos = idxs.indexOf(state.tasks.indexOf(t)), swap = pos + dir;
  if (swap < 0 || swap >= idxs.length) return;
  var tmp = state.tasks[idxs[pos]]; state.tasks[idxs[pos]] = state.tasks[idxs[swap]]; state.tasks[idxs[swap]] = tmp;
  save(); render();
}
function moveProject(id, dir) {
  var pos = -1;
  state.projects.forEach(function(p, i){ if (p.id === id) pos = i; });
  var swap = pos + dir;
  if (pos < 0 || swap < 0 || swap >= state.projects.length) return;
  var tmp = state.projects[pos]; state.projects[pos] = state.projects[swap]; state.projects[swap] = tmp;
  save(); render();
}
function render() {
  var main = document.getElementById("main");
  var total = state.tasks.length, hc = holdCount(state.tasks);
  var h = '<div class="summary"><span class="big">残っているタスク ' + total + ' 件</span><br>'
    + '<span class="sub">（通常 ' + (total - hc) + ' 件・保留 ' + hc + ' 件）／ ' + state.projects.length + ' プロジェクト</span></div>'
    + '<div class="tabs"><button class="tab' + (ui.view==="project" ? ' active' : '') + '" data-act="tab" data-v="project">プロジェクト別</button>'
    + '<button class="tab' + (ui.view==="assignee" ? ' active' : '') + '" data-act="tab" data-v="assignee">担当別</button></div>';

  if (ui.view === "project") {
    state.projects.forEach(function(p){
      var ts = projTasks(p.id), m = holdCount(ts);
      h += '<section class="project" data-pid="' + p.id + '"><div class="p-head" data-head="' + p.id + '">'
        + '<button class="chev" data-act="toggle" data-id="' + p.id + '">' + (p.open ? '▼' : '▶') + '</button>'
        + '<span class="p-name">' + esc(p.name) + '</span>'
        + (!p.open && ts.length ? '<span class="nbadge">' + ts.length + '</span>' : '')
        + '<span class="p-count">残り ' + ts.length + ' 件' + (m ? '（保留 ' + m + '）' : '') + '</span>';
      h += '<span><button class="mv" data-act="pup" data-id="' + p.id + '">↑</button> <button class="mv" data-act="pdown" data-id="' + p.id + '">↓</button></span>';
      if (ui.delConfirm === p.id) {
        h += '<span class="del-confirm"><button class="del-yes" data-act="delproj-yes" data-id="' + p.id + '">削除する</button><button class="del-no" data-act="delproj-no">やめる</button></span>';
      } else {
        h += '<button class="del-link" data-act="delproj" data-id="' + p.id + '">削除</button>';
      }
      h += '</div>';
      if (p.open) {
        h += '<div class="card">';
        if (!ts.length) h += '<div class="empty">タスクなし</div>';
        sortByPrio(ts).forEach(function(t){ h += taskRow(t, false); });
        if (ui.formFor === p.id) h += addForm(p);
        else h += '<button class="add-row" data-act="openform" data-id="' + p.id + '">＋ タスクを追加</button>';
        h += '</div>';
      }
      h += '</section>';
    });
    h += '<div class="new-proj"><input type="text" id="newProjName" placeholder="新しいプロジェクト名"><button data-act="addproj">プロジェクト追加</button></div>';
  } else {
    var any = false;
    ORDER.forEach(function(k){
      var ts = state.tasks.filter(function(t){ return t.assignee === k; });
      if (!ts.length) return;
      any = true;
      var m = holdCount(ts), c = COLOR[k];
      var isClosed = !!closedA[k];
      h += '<div class="g-head" data-ahead="' + k + '"><button class="chev" data-act="atoggle" data-v="' + k + '">' + (isClosed ? '▶' : '▼') + '</button><span class="dot" style="background:' + c + '"></span><span class="g-name">' + esc(LABEL[k]) + '</span>'
        + (isClosed && ts.length ? '<span class="nbadge">' + ts.length + '</span>' : '')
        + '<span class="g-count">' + ts.length + ' 件' + (m ? '（保留 ' + m + '）' : '') + '</span></div>';
      if (!isClosed) {
        h += '<div class="card">';
        sortByPrio(ts).forEach(function(t){ h += taskRow(t, true); });
        h += '</div>';
      }
    });
    if (!any) h += '<div class="empty">タスクなし</div>';
  }
  main.innerHTML = h;
  var ft = document.getElementById("formTitle");
  if (ft && ui.formFor !== null) { ft.focus(); }
}

var mainEl = document.getElementById("main");
mainEl.addEventListener("input", function(ev){
  if (ev.target.id === "formTitle") ui.formTitle = ev.target.value;
});
mainEl.addEventListener("click", function(ev){
  if (suppressClick) { suppressClick = false; return; }
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) {
    var ahead = ev.target.closest ? ev.target.closest("[data-ahead]") : null;
    if (ahead) {
      var ak = ahead.getAttribute("data-ahead");
      if (closedA[ak]) delete closedA[ak]; else closedA[ak] = true;
      saveUi(); render();
      return;
    }
    var head = ev.target.closest ? ev.target.closest("[data-head]") : null;
    if (head) {
      var hid = parseInt(head.getAttribute("data-head"), 10);
      state.projects.forEach(function(p){ if (p.id === hid) p.open = !p.open; });
      save(); render();
    }
    return;
  }
  var act = el.getAttribute("data-act");
  var id = parseInt(el.getAttribute("data-id"), 10);
  var v = el.getAttribute("data-v");
  if (act === "tab") { ui.view = v; render(); }
  else if (act === "toggle") { state.projects.forEach(function(p){ if (p.id === id) p.open = !p.open; }); save(); render(); }
  else if (act === "delproj") { ui.delConfirm = id; render(); }
  else if (act === "delproj-no") { ui.delConfirm = null; render(); }
  else if (act === "delproj-yes") {
    state.projects = state.projects.filter(function(p){ return p.id !== id; });
    state.tasks = state.tasks.filter(function(t){ return t.projectId !== id; });
    ui.delConfirm = null; save(); render();
  }
  else if (act === "hold") { state.tasks.forEach(function(t){ if (t.id === id) t.hold = !t.hold; }); save(); render(); }
  else if (act === "openform") { ui.formFor = id; ui.formTitle = ""; ui.formStatus = "normal"; ui.formAssignee = "unassigned"; ui.formPriority = "none"; ui.formError = ""; render(); }
  else if (act === "status") { ui.formStatus = v; render(); }
  else if (act === "assignee") { ui.formAssignee = v; render(); }
  else if (act === "submittask") {
    var title = ui.formTitle.trim();
    if (!title) { ui.formError = "タスク名を入力してください"; render(); return; }
    state.tasks.push({ id: Date.now(), projectId: id, title: title, assignee: ui.formAssignee, hold: ui.formStatus === "hold", priority: ui.formPriority === "none" ? null : ui.formPriority });
    ui.formFor = null; ui.formTitle = ""; ui.formError = ""; save(); render();
  }
  else if (act === "atoggle") { if (closedA[v]) delete closedA[v]; else closedA[v] = true; saveUi(); render(); }
  else if (act === "closeform") { ui.formFor = null; ui.formTitle = ""; ui.formError = ""; render(); }
  else if (act === "fprio") { ui.formPriority = v; render(); }
  else if (act === "prio") { state.tasks.forEach(function(t){ if (t.id === id) t.priority = (t.priority === v ? null : v); }); save(); render(); }
  else if (act === "up") { moveTask(id, -1); }
  else if (act === "down") { moveTask(id, 1); }
  else if (act === "pup") { moveProject(id, -1); }
  else if (act === "pdown") { moveProject(id, 1); }
  else if (act === "addproj") {
    var np = document.getElementById("newProjName");
    var name = np.value.trim();
    if (!name) return;
    state.projects.push({ id: Date.now(), name: name, open: true });
    save(); render();
  }
});
mainEl.addEventListener("change", function(ev){
  var el = ev.target;
  if (el.getAttribute && el.getAttribute("data-act") === "done") {
    var id = parseInt(el.getAttribute("data-id"), 10);
    ui.completing[id] = true; render();
    setTimeout(function(){
      state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
      delete ui.completing[id]; save(); render();
    }, 500);
  }
});

var suppressClick = false;
var pendingDrag = null, activeDrag = null;
function clearPending(){ if (pendingDrag) { clearTimeout(pendingDrag.timer); pendingDrag = null; } }
mainEl.addEventListener("pointerdown", function(ev){
  if (pendingDrag || activeDrag) return;
  if (ev.target.closest && ev.target.closest("button, input, select, textarea, a")) return;
  var taskEl = ev.target.closest ? ev.target.closest(".task") : null;
  var headEl = ev.target.closest ? ev.target.closest("[data-head]") : null;
  var kind = null, el = null;
  if (taskEl && ui.view === "project") { kind = "task"; el = taskEl; }
  else if (headEl) { kind = "project"; el = headEl.closest(".project"); }
  if (!el) return;
  pendingDrag = { kind: kind, el: el, sx: ev.clientX, sy: ev.clientY, timer: null };
  var pid = ev.pointerId;
  pendingDrag.timer = setTimeout(function(){ startDrag(pid); }, 350);
});
function startDrag(pointerId){
  if (!pendingDrag) return;
  var pd = pendingDrag; pendingDrag = null;
  pd.el.classList.add("dragging");
  pd.el.style.touchAction = "none";
  try { pd.el.setPointerCapture(pointerId); } catch(e){}
  if (pd.kind === "project") document.body.classList.add("proj-drag");
  activeDrag = { kind: pd.kind, el: pd.el, itemSel: pd.kind === "task" ? ".task" : ".project", sy: pd.sy, dy: 0 };
  if (navigator.vibrate) { try { navigator.vibrate(10); } catch(e){} }
}
window.addEventListener("pointermove", function(ev){
  if (pendingDrag) {
    if (Math.abs(ev.clientX - pendingDrag.sx) > 10 || Math.abs(ev.clientY - pendingDrag.sy) > 10) clearPending();
    return;
  }
  if (!activeDrag) return;
  ev.preventDefault();
  var d = activeDrag, el = d.el;
  d.dy = ev.clientY - d.sy;
  el.style.transform = "translateY(" + d.dy + "px)";
  var center = el.offsetTop + el.offsetHeight / 2 + d.dy;
  var next = el.nextElementSibling;
  while (next && !next.matches(d.itemSel)) next = next.nextElementSibling;
  if (next && center > next.offsetTop + next.offsetHeight / 2) {
    d.sy += next.offsetHeight; d.dy = ev.clientY - d.sy;
    next.parentElement.insertBefore(el, next.nextElementSibling);
    el.style.transform = "translateY(" + d.dy + "px)";
    return;
  }
  var prev = el.previousElementSibling;
  while (prev && !prev.matches(d.itemSel)) prev = prev.previousElementSibling;
  if (prev && center < prev.offsetTop + prev.offsetHeight / 2) {
    d.sy -= prev.offsetHeight; d.dy = ev.clientY - d.sy;
    prev.parentElement.insertBefore(el, prev);
    el.style.transform = "translateY(" + d.dy + "px)";
  }
}, { passive: false });
function endDrag(){
  if (pendingDrag) { clearPending(); return; }
  if (!activeDrag) return;
  var d = activeDrag; activeDrag = null;
  document.body.classList.remove("proj-drag");
  suppressClick = true;
  setTimeout(function(){ suppressClick = false; }, 80);
  if (d.kind === "task") {
    var card = d.el.parentElement;
    var sec = d.el.closest(".project");
    var pid = sec ? parseInt(sec.getAttribute("data-pid"), 10) : null;
    var ids = [];
    card.querySelectorAll(".task").forEach(function(n){ var inp = n.querySelector("[data-act='done']"); if (inp) ids.push(parseInt(inp.getAttribute("data-id"), 10)); });
    if (pid !== null && ids.length) {
      var byId = {}; state.tasks.forEach(function(t){ byId[t.id] = t; });
      var seq = ids.map(function(i){ return byId[i]; }).filter(Boolean);
      var k = 0;
      state.tasks = state.tasks.map(function(t){ return t.projectId === pid ? seq[k++] : t; });
      save();
    }
  } else {
    var pids = [];
    mainEl.querySelectorAll(".project").forEach(function(n){ pids.push(parseInt(n.getAttribute("data-pid"), 10)); });
    var byPid = {}; state.projects.forEach(function(p){ byPid[p.id] = p; });
    var nseq = pids.map(function(i){ return byPid[i]; }).filter(Boolean);
    if (nseq.length === state.projects.length) { state.projects = nseq; save(); }
  }
  render();
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

render();
</script>
</body>
</html>
